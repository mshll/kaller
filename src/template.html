<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#09090b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Kaller</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-base: #09090b;
            --bg-surface: #18181b;
            --bg-elevated: #27272a;
            --accent: #22d3ee;
            --accent-glow: #22d3ee40;
            --success: #4ade80;
            --error: #f87171;
            --text: #fafafa;
            --text-muted: #a1a1aa;
            --border: #3f3f46;
            --radius: 12px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        html {
            font-size: 16px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-base);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            line-height: 1.6;
            overflow-x: hidden;
        }

        .bg-pattern {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 50% -20%, var(--accent-glow), transparent),
                radial-gradient(ellipse 60% 40% at 100% 100%, #8b5cf620, transparent);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 1.5rem 1rem;
            padding-bottom: calc(1.5rem + var(--safe-bottom));
        }

        @media (min-width: 640px) {
            .container {
                padding: 3rem 1.5rem;
            }
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        @media (min-width: 640px) {
            header {
                margin-bottom: 3rem;
            }
        }

        .logo {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.25rem;
        }

        @media (min-width: 640px) {
            .logo {
                font-size: 3rem;
                margin-bottom: 0.5rem;
            }
        }

        .tagline {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        @media (min-width: 640px) {
            .tagline {
                font-size: 0.95rem;
            }
        }

        .config-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 999px;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            margin-top: 1rem;
            transition: all 0.2s;
        }

        .config-btn:hover {
            border-color: var(--accent);
            color: var(--text);
        }

        .config-btn:active {
            transform: scale(0.98);
        }

        .config-btn.loading {
            pointer-events: none;
            opacity: 0.7;
        }

        .config-btn.connected {
            background: #22d3ee15;
            border-color: #22d3ee50;
            color: var(--accent);
            pointer-events: none;
        }

        .config-btn .config-icon {
            font-size: 0.9rem;
        }

        .config-btn.connected .config-icon {
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem;
            margin-bottom: 1rem;
        }

        @media (min-width: 640px) {
            .card {
                padding: 1.5rem;
                margin-bottom: 1.25rem;
            }
        }

        .card-primary {
            border-color: var(--accent);
            border-width: 1px;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .card-collapsible {
            padding: 0;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.25rem;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }

        @media (min-width: 640px) {
            .card-header {
                padding: 1.25rem 1.5rem;
            }
        }

        .card-header:hover {
            background: var(--bg-elevated);
        }

        .card-header:active {
            background: var(--bg-base);
        }

        .collapse-icon {
            font-size: 0.75rem;
            color: var(--text-muted);
            transition: transform 0.3s;
        }

        .collapse-icon.expanded {
            transform: rotate(180deg);
        }

        .card-body {
            padding: 0 1.25rem 1.25rem;
            overflow: hidden;
            transition: max-height 0.3s ease, padding 0.3s ease, opacity 0.2s;
            max-height: 1000px;
            opacity: 1;
        }

        @media (min-width: 640px) {
            .card-body {
                padding: 0 1.5rem 1.5rem;
            }
        }

        .card-body.collapsed {
            max-height: 0;
            padding-top: 0;
            padding-bottom: 0;
            opacity: 0;
        }

        .card-title {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            margin: 0;
        }

        @media (min-width: 640px) {
            .card-title {
                font-size: 1rem;
                gap: 0.75rem;
            }
        }

        .card-title .icon {
            font-size: 1.1rem;
        }

        .tool-section {
            padding: 1rem 0;
            border-bottom: 1px solid var(--border);
        }

        .tool-section:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .tool-section:first-child {
            padding-top: 0.5rem;
        }

        .tool-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 0.75rem;
            color: var(--text-muted);
        }

        .tool-row {
            display: flex;
            gap: 0.5rem;
        }

        .tool-row input {
            flex: 1;
            padding: 0.75rem 1rem;
        }

        .tool-row .btn {
            width: auto;
            padding: 0.75rem 1.25rem;
            white-space: nowrap;
        }

        .search-box {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        @media (min-width: 480px) {
            .search-box {
                flex-direction: row;
            }
        }

        .search-box input {
            flex: 1;
        }

        .btn-search {
            min-width: 100px;
        }

        @media (min-width: 480px) {
            .btn-search {
                width: auto;
            }
        }

        .btn-secondary {
            background: var(--bg-elevated);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--text-muted);
            background: var(--border);
        }

        .btn-full {
            width: 100%;
        }

        .badge {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.6rem;
            font-weight: 500;
            padding: 0.2rem 0.4rem;
            background: var(--bg-elevated);
            border-radius: 4px;
            color: var(--text-muted);
        }

        @media (min-width: 640px) {
            .badge {
                font-size: 0.65rem;
                padding: 0.25rem 0.5rem;
            }
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        input {
            width: 100%;
            padding: 0.875rem 1rem;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 16px; /* Prevents iOS zoom */
            background: var(--bg-base);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            transition: all 0.2s;
            -webkit-appearance: none;
            appearance: none;
        }

        @media (min-width: 640px) {
            input {
                padding: 0.75rem 1rem;
                font-size: 0.9rem;
            }
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        input::placeholder {
            color: var(--text-muted);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.875rem 1.5rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            touch-action: manipulation;
        }

        @media (min-width: 640px) {
            .btn {
                width: auto;
                padding: 0.75rem 1.5rem;
                font-size: 0.875rem;
            }
        }

        .btn-primary {
            background: var(--accent);
            color: var(--bg-base);
        }

        .btn-primary:hover {
            filter: brightness(1.1);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .tab {
            flex: 1;
            padding: 0.75rem 0.5rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            touch-action: manipulation;
        }

        @media (min-width: 640px) {
            .tab {
                padding: 0.6rem 1rem;
                font-size: 0.85rem;
            }
        }

        .tab:hover {
            border-color: var(--text-muted);
        }

        .tab.active {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--bg-base);
        }

        .output {
            margin-top: 1rem;
            padding: 0.875rem;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.75rem;
            background: var(--bg-base);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-muted);
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 150px;
            overflow-y: auto;
            display: none;
            -webkit-overflow-scrolling: touch;
        }

        @media (min-width: 640px) {
            .output {
                padding: 1rem;
                font-size: 0.8rem;
                max-height: 200px;
            }
        }

        .output.visible {
            display: block;
        }

        .output.success {
            border-color: var(--success);
            color: var(--success);
        }

        .output.error {
            border-color: var(--error);
            color: var(--error);
        }

        .results {
            margin-top: 1rem;
        }

        .result-item {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            padding: 0.875rem;
            background: var(--bg-base);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 0.5rem;
            transition: border-color 0.2s;
        }

        @media (min-width: 480px) {
            .result-item {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                gap: 0.5rem;
            }
        }

        .result-item:active {
            border-color: var(--accent);
        }

        .result-name {
            font-weight: 500;
            font-size: 0.9rem;
        }

        .result-phone {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.85rem;
            color: var(--accent);
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid var(--bg-base);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .config-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.5rem;
            margin-top: 1rem;
            display: none;
        }

        @media (min-width: 480px) {
            .config-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.75rem;
            }
        }

        .config-grid.visible {
            display: grid;
        }

        .config-item {
            padding: 0.75rem;
            background: var(--bg-base);
            border-radius: 8px;
        }

        .config-key {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        .config-value {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.8rem;
            color: var(--accent);
            word-break: break-all;
        }

        .more-results {
            text-align: center;
            padding: 0.75rem;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        footer {
            margin-top: 2rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.75rem;
            padding-bottom: 1rem;
        }

        @media (min-width: 640px) {
            footer {
                margin-top: 3rem;
                font-size: 0.8rem;
            }
        }

        footer a {
            color: var(--accent);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        /* iOS safe areas */
        @supports (padding: max(0px)) {
            .container {
                padding-left: max(1rem, env(safe-area-inset-left));
                padding-right: max(1rem, env(safe-area-inset-right));
            }
        }

        /* Hide scrollbar but keep functionality */
        .output::-webkit-scrollbar {
            width: 4px;
        }

        .output::-webkit-scrollbar-track {
            background: var(--bg-base);
        }

        .output::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>

    <div class="container">
        <header>
            <div class="logo">Kaller</div>
            <p class="tagline">Kuwait Phone Directory Lookup</p>
            <button class="config-btn" onclick="quickLoadConfig()" id="quickConfigBtn">
                <span class="config-icon">⚡</span>
                <span class="config-text">Connect to API</span>
            </button>
        </header>

        <!-- Search Card (Primary) -->
        <div class="card card-primary">
            <div class="tabs">
                <button class="tab active" onclick="setSearchType('phone', this)">🔍 Who's This Number?</button>
                <button class="tab" onclick="setSearchType('name', this)">📱 Find Number</button>
            </div>

            <div class="search-box">
                <input type="text" id="searchTerm" placeholder="Enter phone number..." inputmode="tel" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
                <button class="btn btn-primary btn-search" onclick="performSearch()" id="searchBtn">
                    <span class="btn-text">Search</span>
                </button>
            </div>

            <div class="output" id="searchOutput"></div>
            <div class="results" id="searchResults"></div>
        </div>

        <!-- Advanced Section -->
        <div class="card card-collapsible">
            <div class="card-header" onclick="toggleSection('advanced')">
                <div class="card-title">
                    <span class="icon">🛠️</span>
                    Advanced Tools
                </div>
                <span class="collapse-icon" id="advancedIcon">▼</span>
            </div>
            <div class="card-body collapsed" id="advancedBody">
                <!-- Verify -->
                <div class="tool-section">
                    <div class="tool-header">
                        <span>📱 SMS Verification</span>
                        <span class="badge">SMS</span>
                    </div>
                    <div class="tool-row">
                        <input type="text" id="verifyPhone" placeholder="Phone number..." inputmode="tel" autocomplete="off">
                        <button class="btn btn-secondary" onclick="sendVerification()">Send</button>
                    </div>
                    <div class="output" id="verifyOutput"></div>
                </div>

                <!-- Block -->
                <div class="tool-section">
                    <div class="tool-header">
                        <span>🚫 Block Request</span>
                        <span class="badge">FREE</span>
                    </div>
                    <div class="tool-row">
                        <input type="text" id="blockPhone" placeholder="Phone to block..." inputmode="tel" autocomplete="off">
                        <button class="btn btn-secondary" onclick="requestBlock()">Block</button>
                    </div>
                    <div class="output" id="blockOutput"></div>
                </div>

                <!-- Config -->
                <div class="tool-section">
                    <div class="tool-header">
                        <span>⚙️ Configuration</span>
                        <span class="badge">FIREBASE</span>
                    </div>
                    <button class="btn btn-secondary btn-full" onclick="loadConfig()" id="configBtn">
                        Load Config
                    </button>
                    <div class="config-grid" id="configOutput"></div>
                </div>
            </div>
        </div>

        <footer>
            Kaller • Built with Bun
        </footer>
    </div>

    <script>
        let searchType = 'phone';

        function setSearchType(type, el) {
            searchType = type;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');

            const input = document.getElementById('searchTerm');
            if (type === 'name') {
                input.placeholder = 'Enter name to find number...';
                input.inputMode = 'text';
            } else {
                input.placeholder = 'Enter phone number...';
                input.inputMode = 'tel';
            }
        }

        function toggleSection(section) {
            const body = document.getElementById(section + 'Body');
            const icon = document.getElementById(section + 'Icon');

            body.classList.toggle('collapsed');
            icon.classList.toggle('expanded');
        }

        let configLoaded = false;

        async function quickLoadConfig() {
            const btn = document.getElementById('quickConfigBtn');
            btn.classList.add('loading');
            btn.innerHTML = '<span class="config-icon">⏳</span><span class="config-text">Connecting...</span>';

            try {
                const res = await fetch('/api/config');
                if (!res.ok) throw new Error('Failed to connect');
                await res.json();

                configLoaded = true;
                btn.classList.remove('loading');
                btn.classList.add('connected');
                btn.innerHTML = '<span class="config-icon">✓</span><span class="config-text">Connected</span>';
            } catch (e) {
                btn.classList.remove('loading');
                btn.innerHTML = '<span class="config-icon">⚠️</span><span class="config-text">Retry Connection</span>';
            }
        }

        async function loadConfig() {
            const btn = document.getElementById('configBtn');
            btn.innerHTML = '<span class="spinner"></span>';
            btn.disabled = true;

            try {
                const res = await fetch('/api/config');
                const config = await res.json();

                const output = document.getElementById('configOutput');
                output.innerHTML = Object.entries(config).map(([key, value]) => {
                    let displayValue = String(value);
                    if (key.includes('key') || key.includes('sec')) {
                        displayValue = displayValue.substring(0, 12) + '...';
                    }
                    return `<div class="config-item">
                        <div class="config-key">${key}</div>
                        <div class="config-value">${displayValue}</div>
                    </div>`;
                }).join('');
                output.classList.add('visible');

                // Also update quick button
                if (!configLoaded) {
                    configLoaded = true;
                    const quickBtn = document.getElementById('quickConfigBtn');
                    quickBtn.classList.add('connected');
                    quickBtn.innerHTML = '<span class="config-icon">✓</span><span class="config-text">Connected</span>';
                }
            } catch (e) {
                alert('Error: ' + e.message);
            }

            btn.innerHTML = 'Reload Config';
            btn.disabled = false;
        }

        async function performSearch() {
            const term = document.getElementById('searchTerm').value.trim();
            if (!term) return alert('Enter a search term');

            const btn = document.getElementById('searchBtn');
            const output = document.getElementById('searchOutput');
            const results = document.getElementById('searchResults');

            btn.innerHTML = '<span class="spinner"></span>';
            btn.disabled = true;
            output.className = 'output visible';
            output.textContent = 'Searching...';
            results.innerHTML = '';

            try {
                const res = await fetch(`/api/search?term=${encodeURIComponent(term)}&type=${searchType}`);
                const data = await res.json();

                if (data.error) {
                    output.className = 'output visible error';
                    output.textContent = '❌ ' + data.error;
                } else {
                    output.className = 'output visible success';
                    output.textContent = `✅ Found ${data.length} results`;

                    results.innerHTML = data.slice(0, 30).map((item, i) =>
                        `<div class="result-item">
                            <span class="result-name">${i + 1}. ${item.name}</span>
                            <span class="result-phone">${item.phone}</span>
                        </div>`
                    ).join('');

                    if (data.length > 30) {
                        results.innerHTML += `<div class="more-results">...and ${data.length - 30} more results</div>`;
                    }
                }
            } catch (e) {
                output.className = 'output visible error';
                output.textContent = '❌ ' + e.message;
            }

            btn.innerHTML = 'Search';
            btn.disabled = false;
        }

        async function sendVerification() {
            const phone = document.getElementById('verifyPhone').value.trim();
            if (!phone) return alert('Enter a phone number');

            const output = document.getElementById('verifyOutput');
            output.className = 'output visible';
            output.textContent = 'Sending...';

            try {
                const res = await fetch(`/api/verify?phone=${encodeURIComponent(phone)}`);
                const text = await res.text();
                output.className = 'output visible success';
                output.textContent = '✅ Response: ' + text;
            } catch (e) {
                output.className = 'output visible error';
                output.textContent = '❌ ' + e.message;
            }
        }

        async function requestBlock() {
            const phone = document.getElementById('blockPhone').value.trim();
            if (!phone) return alert('Enter a phone number');

            const output = document.getElementById('blockOutput');
            output.className = 'output visible';
            output.textContent = 'Requesting...';

            try {
                const res = await fetch(`/api/block?phone=${encodeURIComponent(phone)}`);
                const text = await res.text();
                output.className = 'output visible success';
                output.textContent = '✅ Response: ' + text;
            } catch (e) {
                output.className = 'output visible error';
                output.textContent = '❌ ' + e.message;
            }
        }

        // Handle Enter key on inputs
        document.getElementById('searchTerm').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        document.getElementById('verifyPhone').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendVerification();
        });

        document.getElementById('blockPhone').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') requestBlock();
        });

        // Focus search input on load
        document.getElementById('searchTerm').focus();
    </script>
</body>
</html>
